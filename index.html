<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <title>Webshop</title>
</head>
<body>
    <table class="table table-bordered">
  <thead>
    <tr>
      <th scope="col">név</th>
      <th scope="col">email</th>
      <th scope="col">telefenszám</th>
      <th scope="col">város</th>
      <th scope="col">Szerepkör</th>
    </tr>
  </thead>
  <tbody id="users-body"></tbody>
</table>

<hr>

<div class="form">
  <button onclick="urites()">inputok űrítése</button>
  <div class="form-field">
    <label for="name" class="form-label">Név</label>
    <input class="form-control" id="name">
  </div>
  <div class="form-field">
    <label for="email" class="form-label">Email</label>
    <input class="form-control" id="email" type="email">
  </div>
  <div class="form-field">
    <label for="phone" class="form-label">Telefonszám</label>
    <input class="form-control" id="phone" type="tel">
  </div>
  <div class="form-field">
    <label for="city" class="form-label">Város</label>
    <input class="form-control" id="city">
  </div>
  <div class="form-field">
    <label for="role" class="form-label">Szerepkör</label>
    <input class="form-control" id="role">
  </div>
  <button class="btn btn-primary" id="add-user" onclick="addUser()">Hozzáadás</button>
  <button class="btn btn-primary" id="edit-user" onclick="editUser()">Szerkesztés</button>
  <button class="btn btn-outline theme-danger" id="delete-user" onclick="deleteUser()" hidden type="button">Törlés</button>

</div>

<hr>
  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="main.js"></script>
</body>
</html>
