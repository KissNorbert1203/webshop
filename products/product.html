<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="product.css">
    <title>Products</title>
</head>
<body>
    <section class="container py-4" aria-label="Termékek">
        <h1 class="h2 mb-4">Termékek</h1>
        <div id="product-list" class="product-list">
        </div>
        <section id="product-details" class="mt-4" aria-live="polite" hidden>
            <h2 id="product-details-title" class="h3 mb-3"></h2>
            <div id="product-details-content" class="bg-light p-3 rounded"></div>
        </section>

        <section class="mt-5 border-top pt-4" aria-labelledby="add-product-title">
            <h2 id="add-product-title" class="h3 mb-3">Új termék hozzáadása</h2>
            <form id="product-form" class="row g-3">
                <div class="col-12 col-md-6">
                    <label for="product-name" class="form-label">Termék neve</label>
                    <input id="product-name" class="form-control" type="text" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="product-image" class="form-label">Kép URL</label>
                    <input id="product-image" class="form-control" type="url">
                </div>
                <div class="col-12 col-sm-4">
                    <label for="product-price" class="form-label">Ár (Ft)</label>
                    <input id="product-price" class="form-control" type="number" min="0" required>
                </div>
                <div class="col-12 col-sm-4">
                    <label for="product-stock" class="form-label">Készlet (db)</label>
                    <input id="product-stock" class="form-control" type="number" min="0" step="1" required>
                </div>
                <div class="col-12 col-sm-4">
                    <label for="product-rating" class="form-label">Értékelés</label>
                    <input id="product-rating" class="form-control" type="number" min="0" max="5" step="0.1" required>
                </div>
                <div class="col-12 col-md-6">
                    <label for="manufacturer-name" class="form-label">Gyártó neve</label>
                    <input id="manufacturer-name" class="form-control" type="text">
                </div>
                <div class="col-12 col-md-6">
                    <label for="manufacturer-country" class="form-label">Gyártó országa</label>
                    <input id="manufacturer-country" class="form-control" type="text">
                </div>
                <div class="col-12">
                    <label for="product-features" class="form-label">Jellemzők</label>
                    <input id="product-features" class="form-control" type="text" placeholder="Például: 16 GB RAM, 1 TB SSD">
                </div>
                <div class="col-12">
                    <button class="btn btn-primary" type="submit">Termék hozzáadása</button>
                    <button class="btn btn-outline-secondary" type="reset">Űrlap ürítése</button>
                </div>
                <p id="product-form-message" class="col-12 mb-0" role="status"></p>
            </form>
        </section>
    </section>

    <script src="product.js"></script>
</body>
</html>
